<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="fonts.css">
</head>
<body>
    <div class="bg-img-cont">
        <h1>ZIP!</h1>
    </div>
    <div class="form-section">
        <h2>Compress it, Extract it!</h2>
        <form action="#" method="post">
            <div class="container-form">
                <div class="container-form-item">
                    <label for="user-first-name">First Name</label>
                    <input type="text" id="user-first-name" name="user-first-name" required>
                </div>
                <div class="container-form-item">
                    <label for="user-last-name">Last Name</label>
                    <input type="text" id="user-last-name" name="user-last-name" required>
                </div>
                <div class="container-form-item">
                    <label for="user-email">Email</label>
                    <input type="email" id="user-email" name="user-email" required>
                </div>
                <div class="container-form-item">
                    <label for="user-phone">Phone</label>
                    <input type="tel" id="user-phone" name="user-phone" required>
                </div>
                <div class="container-form-item">
                    <label for="user-password">Password</label>
                    <input type="password" id="user-password" name="user-password" required>
                </div>
                <div class="container-form-item">
                    <label for="user-confirm-password">Confirm Password</label>
                    <input type="password" id="user-confirm-password" name="user-confirm-password" required>
                </div>
            </div>
            <div>
                <button class="create-acc-button" type="submit">Create Account</button>
                <p>Already have an account? <a href="#">Log In</a></p>
            </div>
        </form>
    </div>
</body>
</html>
