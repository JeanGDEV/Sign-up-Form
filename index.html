<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="fonts.css">
    <link rel="shortcut icon" href="images/zip-svgrepo-com.svg" type="image/x-icon">
</head>
<body>
    <div class="bg-img-cont">
        <h1>ZIP!</h1>
    </div>
    <div class="form-section">
        <h2>Compress it, Extract it!</h2>
        <form action="#" method="post">
            <div class="container-form">
                <div class="item-flex-row">
                    <div class="container-form-item">
                        <label for="user-first-name">First Name</label>
                        <input type="text" id="user-first-name" name="user-first-name" title="Type your first name" placeholder="John" required>
                    </div>
                    <div class="container-form-item">
                        <label for="user-last-name">Last Name</label>
                        <input type="text" id="user-last-name" name="user-last-name" title="Type your last name" placeholder="Doe" required>
                    </div>
                </div>
                <div class="item-flex-row">
                    <div class="container-form-item">
                        <label for="user-email">Email</label>
                        <input type="email" id="user-email" name="user-email" title="Type your email" placeholder="john123@gmail.com" required>
                    </div>
                    <div class="container-form-item">
                        <label for="user-phone">Phone</label>
                        <input type="tel" id="user-phone" name="user-phone" title="Type your phone number" placeholder="+58 (022) 1234567" required>
                    </div>
                </div>
                <div class="item-flex-row">
                    <div class="container-form-item">
                        <label for="user-password">Password</label>
                        <input type="password" id="user-password" name="user-password" title="Type a strong password" required>
                    </div>
                    <div class="container-form-item">
                        <label for="user-confirm-password">Confirm Password</label>
                        <input type="password" id="user-confirm-password" name="user-confirm-password" title="Type again the password" required>
                    </div>
                </div>
            </div>
            <div class="form-bottom">
                <button class="create-acc-button" type="submit">Create Account</button>
                <p>Already have an account? <a href="#">Log In</a></p>
            </div>
        </form>
    </div>
</body>
</html>
